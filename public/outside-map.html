<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiruna Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/outside-map.css">
  </head>
  <body>

    <div class="timeline-wrap">
      <div class="watermark" id="watermark">2004</div>
      <div class="track-outer">
        <div class="track-row">
          <div class="track-line"></div>
          <div class="nodes-row" id="nodes-row"></div>
        </div>
        <div class="year-labels-row" id="year-labels"></div>
        <div class="drag-hint-row">
          <div class="drag-hint-line1">
            <span class="drag-hint-label">Drag to explore</span>
            <span class="drag-hint-track"><span class="drag-hint-thumb"></span></span>
          </div>
          <div class="drag-hint-line2">
            <span class="drag-hint-kbd">or use <kbd>←</kbd><kbd>→</kbd></span>
          </div>
        </div>
      </div>
    </div>

    <div class="year-bar">
      <div class="yb-left">
        <span class="yb-year" id="yb-year">—</span>
        <div class="yb-stats" id="yb-stats"></div>
      </div>
      <div class="yb-filter" id="yb-filter">
        <button class="yb-filter-btn" id="yb-filter-btn" aria-haspopup="listbox">
          <span class="yf-dot" id="yf-dot"></span>
          <span class="yf-label" id="yf-label">All fields</span>
          <svg class="yf-chevron" width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M1.5 3L4.5 6L7.5 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="yf-dropdown" id="yf-dropdown" role="listbox"></div>
      </div>
      <div class="yb-right">
        <button class="toggle-btn" id="toggle-btn">
          <span class="tb-icon"><span class="tb-l1"></span><span class="tb-l2"></span><span class="tb-l3"></span></span>
          <span id="toggle-label">Expand cards</span>
          <span class="icon"></span>
        </button>
      </div>
    </div>

    <div class="field-bar" id="field-bar">
      <div class="field-comp-row" id="field-comp-row"></div>
    </div>

    <div class="main-area" id="main-area" data-view="collapsed">
      <div class="overview-panel" id="overview-panel"></div>
      <div class="cards-container" id="cards-container">
        <button class="nav-arrow nav-left hidden" id="nav-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="cards-vp" id="cards-vp"></div>
        <button class="nav-arrow nav-right hidden" id="nav-right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div class="density-wrap">
        <div class="density-header"><span class="density-title">Event density</span></div>
        <div class="density-chart" id="density-chart"></div>
      </div>
    </div>

    <script src="./js/outside-data.js"></script>
    <script src="./js/outside-map.js"></script>
  </body>
</html>
